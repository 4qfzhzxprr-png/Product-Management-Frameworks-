[package]
name = "daily-work"
version = "0.1.0"
description = "A manager's command center in the menu bar"
edition = "2021"
publish = false

[lib]
name = "daily_work_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
# The system's own TLS, so requests trust what the Mac trusts, including the certificates a
# company network adds for inspection. The default TLS ships its own fixed list instead.
tauri-plugin-http = { version = "2", default-features = false, features = ["native-tls", "http2", "charset", "system-proxy", "macos-system-configuration"] }
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
